name: backport

# shell: bash gives -eo pipefail, so a script failing before a pipe (classify |
# tee) fails the step; the implicit default is bash -e without pipefail.
defaults:
  run:
    shell: bash

# Reusable workflow: cherry-pick a merged main PR into the release branch named
# by its `backport release-X.Y.Z` label(s) and open the backport PR.
#
# The caller's stub (templates/workflows/backport.yaml) runs on
# pull_request_target closed/labeled for main. One label = one target = one PR;
# several labels make several PRs. Targets that already have a PR are skipped,
# so re-labelling never duplicates. The label of a released branch no longer
# exists (GA deletes it), so a released branch cannot be targeted.
#
# On a conflict the action commits the conflicted state as a *draft* PR and
# comments the resolution steps. The last step labels such drafts
# `backport-manual` and pings Slack; the developer resets that commit and redoes
# `git cherry-pick -x` by hand.
#
# Uses the release App token, not GITHUB_TOKEN: PRs created with GITHUB_TOKEN
# do not trigger other workflows, which would leave the backport PR without
# its required checks and therefore unmergeable.
#
# Variables (all prefixed CLOUD_COMPONENT_): RELEASE_APP_ID, RELEASE_TEAM, SLACK_CHANNEL_ID.
# Secrets (inherit): CLOUD_COMPONENT_RELEASE_APP_PRIVATE_KEY, SLACK_OAUTH_TOKEN.

on:
  workflow_call:
    secrets:
      CLOUD_COMPONENT_RELEASE_APP_PRIVATE_KEY:
        required: true
      SLACK_OAUTH_TOKEN:
        required: false

jobs:
  backport:
    name: backport PR #${{ github.event.pull_request.number }}
    if: >
      github.event.pull_request.merged == true &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport release-')
    runs-on: ubuntu-latest
    steps:
      - name: Require release variables
        env:
          RELEASE_APP_ID: ${{ vars.CLOUD_COMPONENT_RELEASE_APP_ID }}
          RELEASE_TEAM: ${{ vars.CLOUD_COMPONENT_RELEASE_TEAM }}
        run: |
          for v in RELEASE_APP_ID RELEASE_TEAM; do
            [ -n "${!v}" ] || { echo "::error::variable CLOUD_COMPONENT_$v is empty; set it as an organization (or repository) variable"; exit 1; }
          done

      - name: Mint release App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLOUD_COMPONENT_RELEASE_APP_ID }}
          private-key: ${{ secrets.CLOUD_COMPONENT_RELEASE_APP_PRIVATE_KEY }}

      # The base branch (main), not the PR head: pull_request_target runs with
      # secrets, so untrusted PR code must never be checked out here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Check out the release kit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit

      - name: Cherry-pick and open backport PRs
        id: bp
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ steps.app.outputs.token }}
          label_pattern: '^backport (release-[0-9]+\.[0-9]+\.[0-9]+)$'
          pull_title: '${pull_title}'
          # The trailer is repeated in the PR body so it survives the squash
          # merge whichever commit-message default the repository uses.
          # release-notes.sh needs it on the release-branch commit to tell a
          # backport from a new change.
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.

            Created by the backport workflow from the merged main commit; the
            cherry-pick trailer is the provenance the release-policy check verifies.

            (cherry picked from commit ${{ github.event.pull_request.merge_commit_sha }})
          add_author_as_assignee: true
          add_team_reviewers: ${{ vars.CLOUD_COMPONENT_RELEASE_TEAM }}
          copy_labels_pattern: '^(release-blocker|tag-rc)$'
          auto_merge_enabled: true
          auto_merge_method: squash
          merge_commits: fail
          git_committer_name: ${{ steps.app.outputs.app-slug }}[bot]
          git_committer_email: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com
          experimental: '{"conflict_resolution":"draft_commit_conflicts"}'

      # Drafts are conflicts in this mode: label them so release-policy accepts a
      # hand-resolved (non-identical) cherry-pick, and tell the channel.
      - name: Label conflicting drafts and notify
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLACK_OAUTH_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.CLOUD_COMPONENT_SLACK_CHANNEL_ID }}
          CREATED: ${{ steps.bp.outputs.created_pull_numbers }}
          SRC: ${{ github.event.pull_request.number }}
        run: |
          repo=${GITHUB_REPOSITORY#*/}
          src_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$SRC"
          src_title=$(gh pr view "$SRC" --json title -q .title 2>/dev/null || echo "")
          if [ "${{ steps.bp.outcome }}" != "success" ]; then
            .release-kit/scripts/slack-notify.sh --color danger --link "$src_url|source PR" \
              --title ":x: *$repo* · backport of #$SRC failed" \
              "• $src_title
          • The backport bot left a comment on the source PR with the reason"
          fi
          for n in $(tr ',' ' ' <<<"$CREATED"); do
            [ -n "$n" ] || continue
            base=$(gh pr view "$n" --json baseRefName -q .baseRefName)
            pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$n"
            if [ "$(gh pr view "$n" --json isDraft -q .isDraft)" = "true" ]; then
              gh pr edit "$n" --add-label backport-manual
              .release-kit/scripts/slack-notify.sh --color warning --link "$pr_url|draft PR #$n" --link "$src_url|source PR" \
                --title ":warning: *$repo* · backport #$SRC → \`$base\` has conflicts" \
                "• $src_title
          • Draft PR #$n holds the conflicted state; redo the cherry-pick by hand (\`git cherry-pick -x\`), push, mark ready
          • Labelled \`backport-manual\` so release-policy accepts the hand-resolved content"
            else
              .release-kit/scripts/slack-notify.sh --color info --link "$pr_url|PR #$n" --link "$src_url|source PR" \
                --title ":arrow_right: *$repo* · backport #$SRC → \`$base\`" \
                "• $src_title
          • Auto-merge is on: one release-manager approval merges it once the required checks are green"
            fi
          done
