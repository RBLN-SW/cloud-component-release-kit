name: cut-release

# shell: bash gives -eo pipefail, so a script failing before a pipe (classify |
# tee) fails the step; the implicit default is bash -e without pipefail.
defaults:
  run:
    shell: bash

# Reusable workflow: cut a release branch and tag vX.Y.Z-rc1.
#
# Called from a repository's .github/workflows/cut-release.yaml stub
# (templates/workflows/cut-release.yaml) on workflow_dispatch. The kind decides
# the number and the starting point (scripts/cut-release.sh):
#   minor  release-X.(Y+1).0 from main        everything merged since the last GA
#   patch  release-X.Y.(Z+1) from the GA tag  fixes only, backported afterwards
#   major  release-(X+1).0.0 from main        an explicit decision
# The tag push starts the rc path of release.yaml; this workflow builds nothing.
#
# Branch and tag are pushed with the release GitHub App's token, the only actor
# (besides the release-manager team) the rulesets allow to create release-*
# branches and v* tags. Because the App bypasses the rulesets, the workflow
# itself checks that a release manager pressed the button (App permission
# "Members: read").
#
# Variables (all prefixed CLOUD_COMPONENT_): RELEASE_APP_ID, RELEASE_TEAM, SLACK_CHANNEL_ID.
# Secrets (inherit): CLOUD_COMPONENT_RELEASE_APP_PRIVATE_KEY, SLACK_OAUTH_TOKEN.

on:
  workflow_call:
    inputs:
      kind:
        description: "minor | patch | major"
        required: true
        type: string
      version:
        description: "Override the computed X.Y.Z (first release, or an explicit number)"
        required: false
        default: ""
        type: string
    secrets:
      CLOUD_COMPONENT_RELEASE_APP_PRIVATE_KEY:
        required: true
      SLACK_OAUTH_TOKEN:
        required: false
    outputs:
      version:
        description: "X.Y.Z that was cut"
        value: ${{ jobs.cut.outputs.version }}
      branch:
        description: "release-X.Y.Z"
        value: ${{ jobs.cut.outputs.branch }}
      tag:
        description: "vX.Y.Z-rc1"
        value: ${{ jobs.cut.outputs.tag }}

jobs:
  cut:
    name: cut ${{ inputs.kind }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cut.outputs.version }}
      branch: ${{ steps.cut.outputs.branch }}
      tag: ${{ steps.cut.outputs.tag }}
    env:
      RELEASE_TEAM: ${{ vars.CLOUD_COMPONENT_RELEASE_TEAM }}
    steps:
      - name: Require release variables
        env:
          RELEASE_APP_ID: ${{ vars.CLOUD_COMPONENT_RELEASE_APP_ID }}
        run: |
          for v in RELEASE_APP_ID RELEASE_TEAM; do
            [ -n "${!v}" ] || { echo "::error::variable CLOUD_COMPONENT_$v is empty; set it as an organization (or repository) variable"; exit 1; }
          done

      - name: Mint release App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLOUD_COMPONENT_RELEASE_APP_ID }}
          private-key: ${{ secrets.CLOUD_COMPONENT_RELEASE_APP_PRIVATE_KEY }}

      - name: Require release-manager team membership
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if ! gh api "orgs/${{ github.repository_owner }}/teams/${RELEASE_TEAM}/memberships/${{ github.actor }}" \
               --jq '.state' 2>/dev/null | grep -qx active; then
            echo "::error::${{ github.actor }} is not an active member of ${{ github.repository_owner }}/${RELEASE_TEAM}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Check out the release kit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit

      - name: Cut branch, tag rc1, create backport label
        id: cut
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          KIND: ${{ inputs.kind }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          git config user.name "$BOT"
          git config user.email "$BOT@users.noreply.github.com"
          args=("$KIND")
          [ -n "$VERSION_OVERRIDE" ] && args+=(--version "$VERSION_OVERRIDE")
          .release-kit/scripts/cut-release.sh "${args[@]}"

      - name: Notify Slack
        if: always()
        env:
          SLACK_OAUTH_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.CLOUD_COMPONENT_SLACK_CHANNEL_ID }}
          BRANCH: ${{ steps.cut.outputs.branch }}
          TAG: ${{ steps.cut.outputs.tag }}
          KIND: ${{ inputs.kind }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            case $KIND in
              patch) from="the newest GA tag (fixes only)";;
              *) from="\`main\` (everything merged since the last GA)";;
            esac
            .release-kit/scripts/slack-notify.sh --color info \
              --link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$BRANCH|branch" \
              --title ":scissors: *${GITHUB_REPOSITORY#*/}* · *$BRANCH* · $KIND cut" \
              "• Branch \`$BRANCH\` created from $from
          • \`$TAG\` is publishing to Harbor
          • To get a fix into this release, label its \`main\` PR \`backport $BRANCH\`"
          else
            .release-kit/scripts/slack-notify.sh --color danger \
              --title ":x: *${GITHUB_REPOSITORY#*/}* · cut-release $KIND $VERSION_OVERRIDE failed" \
              "See the workflow run for the reason. Nothing was created."
          fi
